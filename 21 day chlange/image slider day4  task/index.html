<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAGE SLIDER</title>
    <!-- remix icon -->
     <link rel="stylesheet" href="./fonts/remixicon.css">
     <!-- css -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    
    <div class="container">
        <div class="images">
            <img src="./image/image-1.jpg" alt="" class="active">
            <img src="./image/image-2 (1).jpeg" alt="">
            <img src="./image/image-3.jpg" alt="">
            <img src="././image/image-4.jpg" alt="">
            <img src="./image/image-5.jpeg" alt="">
        </div>
        
       <div class="buttons">
         <button class="next"><i class="ri-arrow-right-s-line"></i></button>
         <button class="prev"><i class="ri-arrow-left-s-line"></i></button>
       </div>
    </div>
</body>
<script src="./script.js"></script>
</html>
