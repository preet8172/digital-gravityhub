<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Filter UI</title>
    <link rel="stylesheet" href="./style .css">
</head>
<body>

    <div class="container">
        <h1>Product Filter</h1>

        <div class="filter-buttons">
            <button class="active" data-filter="all">All</button>
            <button data-filter="mobile">Mobile</button>
            <button data-filter="laptop">Laptop</button>
            <button data-filter="watch">Watch</button>
        </div>

        <div class="products">

            <div class="product-card mobile">
                <img src="./images.jpg" alt="">
                <h3>iPhone 15</h3>
                <p>₹79,999</p>
            </div>

            <div class="product-card laptop">
                <img src="./MacBook Air.jpg" alt="">
                <h3>MacBook Air</h3>
                <p>₹1,09,999</p>
            </div>

            <div class="product-card watch">
                <img src="./Apple Watch.jpg" alt="">
                <h3>Apple Watch</h3>
                <p>₹29,999</p>
            </div>

            <div class="product-card mobile">
                <img src="./Samsung S24.avif" alt="">
                <h3>Samsung S24</h3>
                <p>₹74,999</p>
            </div>

            <div class="product-card laptop">
                <img src="./Dell XPS .jpg" alt="">
                <h3>Dell XPS</h3>
                <p>₹89,999</p>
            </div>

            <div class="product-card watch">
                <img src="./Galaxy Watch.jpg" alt="">
                <h3>Galaxy Watch</h3>
                <p>₹19,999</p>
            </div>

        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
